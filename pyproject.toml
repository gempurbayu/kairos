[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "kairos-video-clipper"
version = "0.3.0"
description = "Kairos: AI-assisted short-form video clipping with face tracking, captions, MCP, and agent skill"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.0", "yt-dlp>=2024.1", "mcp>=1.0,<2", "google-genai>=1.0", "python-dotenv>=1.0", "opencv-python-headless>=4.9"]
[project.scripts]
kairos = "youtube_auto_clipper.cli:main"
kairos-mcp = "youtube_auto_clipper.mcp_server:main"
youtube-clipper = "youtube_auto_clipper.cli:main"
youtube-clipper-mcp = "youtube_auto_clipper.mcp_server:main"
[project.urls]
Homepage = "https://github.com/gempurbayu/kairos"
Repository = "https://github.com/gempurbayu/kairos"
Issues = "https://github.com/gempurbayu/kairos/issues"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_auto_clipper = ["web/*.html", "web/*.css", "web/*.js"]
